services:

  postgres:
    image: postgres:16
    container_name: kkbox_postgres
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-kkbox}
      POSTGRES_USER:     ${POSTGRES_USER:-kkbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kkbox}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/10_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kkbox} -d ${POSTGRES_DB:-kkbox}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    container_name: kkbox_mlflow
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MLFLOW_BACKEND_STORE_URI:      postgresql://${POSTGRES_USER:-kkbox}:${POSTGRES_PASSWORD:-kkbox}@postgres:5432/${POSTGRES_DB:-kkbox}
      MLFLOW_ARTIFACTS_DESTINATION:  /mlflow/artifacts
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts

  grafana:
    image: grafana/grafana:10.4.0
    container_name: kkbox_grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER:     admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP:     "false"
      POSTGRES_PASSWORD:          ${POSTGRES_PASSWORD:-kkbox}
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards

volumes:
  postgres_data:
  mlflow_artifacts:
  grafana_data:
